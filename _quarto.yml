project:
  type: book
  output-dir: docs

book:
  title: "quantcrim"
  subtitle: "Een open-web handboek voor kwantitatief criminologisch onderzoek"
  author:
    - name: Joost Jansen
      orcid: 0000-0002-1226-2919
    - name: Gijs Custers
      orcid: 0000-0002-2716-3104
  date: last-modified
  downloads: [pdf]
  repo-url: https://github.com/joostjansen/quantcrim
  repo-actions: [source, issue]
  sidebar:
    search: true
    style: docked
    background: light
    footer: |    
      Licensed under [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)

  chapters:
    - index.qmd
    - part: "Voorbereiding"
      chapters:
        - 001-01-installatie.qmd
        - 001-02-praktischezaken.qmd
    - part: "Data beschrijven"
      chapters:
        - 002-01-data.qmd
        - 002-02-meetniveaus-visualisaties.qmd
        - 002-03-centrum-en-spreidingsmaten.qmd
        - 002-04-relatiesvariabelen.qmd
    - part: "Steekproeven en betrouwbaarheidsinterval"
      chapters:
        - 003-01-steekproeven.qmd
        - 003-02-betrouwbaarheidsinterval.qmd
    - part: "Hypotheses toetsen"
      chapters:
        - 004-01-onafhankelijkegroepen.qmd
        - 004-02-aspectenhypo.qmd
        - 004-03-afhankelijkegroepen.qmd
    - part: "Colleges en practica"
      chapters:
        - 009-01-colleges.qmd
        - 009-02-opdrachten.qmd
  appendices: 
        - formuleblad.qmd
license:
  text: "Erasmus Universiteit Rotterdam<br>CC BY-NC 4.0"
  url: "https://creativecommons.org/licenses/by-nc/4.0/"

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    reference-location: margin
    published-title: "Updated"
    link-citations: true
    
  pdf:
    documentclass: scrreprt
    link-citations: true
    code-overflow: wrap

editor: visual
number-sections: true