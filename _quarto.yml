project:
  type: book
  output-dir: docs

book:
  title: "quantcrim"
  subtitle: "Een open-web handboek voor kwantitatief criminologisch onderzoek"
  author:
    - name: Joost Jansen
      orcid: 0000-0002-1226-2919
#   - name: Malouke Kuiper
#     orcid: 0000-0002-1827-7126
    - name: Gijs Custers
      orcid: 0000-0002-2716-3104
#   - name: Simone Kruit
  date: last-modified
  downloads: [pdf]
  repo-url: https://github.com/joostjansen/quantcrim
  repo-actions: [source, issue]
  sidebar:
    search: true
    style: docked
    background: light
    footer: |    
      Licensed under [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)

  chapters:
    - index.qmd
    - part: "Voorbereiding"
      chapters:
        - 001-voorbereiding.qmd
    - part: "Data beschrijven"
      chapters:
        - 002-01-data.qmd
        - 002-02-meetniveaus-visualisaties.qmd
    - part: "Kans en steekproeven"
      chapters:
        - 003-01-steekproeven.qmd
        - 003-02-kans.qmd
    - part: "Hypotheses"
    - part: "Samenhang tussen variabelen"
    - part: "Colleges"
      chapters:
        - 003-colleges.qmd
    - part: "Opdrachten"
      chapters: 
        - 004-opdrachten.qmd
license:
  text: "CC BY-NC 4.0"
  url: "https://creativecommons.org/licenses/by-nc/4.0/"

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    reference-location: margin
    published-title: "Updated"
    link-citations: true
    
  pdf:
    documentclass: scrreprt
    link-citations: true

editor: visual
